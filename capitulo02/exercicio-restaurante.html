<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercicio Veículo</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 60px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      padding: 10px;
    }

    input[type="submit"] {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Restaurante JS</h1>

  <form>
    <p>
      Buffet por Quilo R$:
      <input type="number" id="inQuilo" min="0" step="0.01" required>
    </p>

    <p>
      Consumo do cliente (gr):
      <input type="number" id="inConsumo" min="0" required>
    </p>
    <input type="submit" value="Calcular Preço">
  </form>

  <h3></h3>


  <script src="js/exercicio-restaurante.js"></script>
</body>

</html>
