<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercicio Lan house</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 60px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      padding: 10px;
    }

    input[type="submit"] {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Lan House JS</h1>

  <form>
    <p>
      Valor por 15min de uso R$:
      <input type="number" id="inValorMinuto" min="0" step="0.01" required>
    </p>

    <p>
      Tempo de uso do cliente:
      <input type="number" id="inTempoUso" min="0" step="0.01" required>
    </p>
    <input type="submit" value="Calcular valor a pagar">
  </form>

  <div>
    <h3></h3>
  </div>


  <script src="js/exercicio-lanshouse.js"></script>
</body>

</html>
