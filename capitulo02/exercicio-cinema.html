<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testes</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 60px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      padding: 10px;
    }

    input[type="submit"] {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Cine js: Filmes em cartaz</h1>

  <form>
    <p>
      Título do filme:
      <input type="text" id="inTitulo" required>
    </p>

    <p>
      Duração (min):
      <input type="number" id="inDuracao" required>
    </p>
    <input type="submit" value="Converter em Horas e Minutos">
  </form>

  <h3></h3>
  <h4></h4>

  <script src="js/exercicio-cinema.js"></script>
</body>

</html>
