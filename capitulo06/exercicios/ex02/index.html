<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastros de números</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <main>
    <h1>Programa números em ordem</h1>
    <form>
      <p>Número:
        <input type="text" id="inNumero" required>
        <input type="submit" value="Adicionar">
      </p>
      <div class="buttons">
        <input type="button" value="Verificar ordem" id="btnVerificar">
      </div>
    </form>

    <div class="resp">
      <h3 id="outLista"></h3>
      <h3 id="outOrdem" class="att"></h3>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
