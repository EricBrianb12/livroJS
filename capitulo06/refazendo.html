<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>refazendo código</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Jogo descubra o número</h1>

    <form>
      <p>Número:
        <input type="number" min="1" max="100" id="inNumero" required autofocus>
      </p>
      <div>
        <input type="submit" value="Apostar" id="btnApostar">
        <input type="button" value="Jogar novamente" id="btnNovo">
      </div>
    </form>

    <div class="result">
      <h3>Erros: <span id="outErros">0</span></h3>
      <h3>Chances: <span id="outChances">6</span></h3>
      <h3 id="outDica">Dica: É um número de 1 a 100.</h3>
    </div>
  </main>

  <script src="js/refazendo.js""></script>
</body>

</html>
