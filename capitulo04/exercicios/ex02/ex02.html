<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa velocidade</title>
  <link rel="stylesheet" href="ex02.css">
</head>

<body>

  <img src="icone.png" alt="icone de programa">

  <form>
    <h1>Programa verifica velocidade</h1>
    <p>Velocidade permitida:
      <input type="number" min="0" id="inVelocidadePermitida" required>
    </p>

    <p>Velocidade do condutor:
      <input type="number" min="0" id="inVelocidadeCondutor" required>
    </p>

    <input type="submit" value="Verificar velocidade">
  </form>

  <h3></h3>

  <script src="ex02.js"></script>
</body>

</html>
