<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa situação aluno</title>

  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 60px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      padding: 10px;
    }

    input[type="submit"] {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Programa situação do aluno</h1>

  <form>
    <p>
      Nome do aluno:
      <input type="text" id="inNomeAluno" required>
    </p>

    <p>
      1° nota:
      <input type="number" id="inNota1" step="0.01" min="0" max="10">
    </p>

    <p>
      2° nota:
      <input type="number" id="inNota2" step="0.01" min="0" max="10">
    </p>

    <input type="submit" value="Exibir média e situação">
  </form>

  <h3></h3>
  <h4></h4>

  <script src="js/ex4_1.js"></script>
</body>

</html>
