<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculo de peso</title>
  <link rel="shortcut icon" href="./assets/ex4_2/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="./styles/ex4_2.css">
</head>

<body>

  <main>
    <img src="./assets/ex4_2/img-teste.jpg" alt="">
    <h1>Programa cálculo do peso ideal</h1>

    <form>
      <p>Nome:
        <input type="text" id="inNome">
      </p>

      <p>Sexo:
        <input type="radio" name="sexo" id="inMasculino"> Masculino
        <input type="radio" name="sexo" id="inFeminino"> Feminino
      </p>

      <p>Altura:
        <input type="number" min="0" step="0.01" id="inAltura">
      </p>

      <div class="buttons">
        <input type="submit" value="Calcular peso ideal">
        <input type="reset" value="Limpar campos">
      </div>
    </form>

    <h3></h3>
  </main>

  <script src="./js/ex4_2.js"></script>
</body>

</html>
